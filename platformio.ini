; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = .
default_envs = st7796s

[env]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
	bodmer/TFT_eSPI@^2.5.43
	bodmer/TFT_eWidget@^0.0.6
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
	xreef/PCF8574 library@^2.4.0
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 115200
board_build.partitions = min_spiffs.csv
build_flags = 
	; -Iinclude
	-DUSER_SETUP_LOADED=1
	-DUSE_HSPI_PORT
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BL=21
	-DTFT_BACKLIGHT_ON=HIGH
	-DTFT_RGB_ORDER=TFT_BGR
	-DSPI_FREQUENCY=55000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DLOAD_GLCD
	-DLOAD_FONT2
	-DLOAD_FONT4
	-DLOAD_FONT6
	-DLOAD_FONT7
	-DLOAD_FONT8
	-DLOAD_GFXFF
	-DTFT_INVERSION_OFF
	; The CYD touch controller is on its own SPI bus. It is initialized in the sketch
	; with XPT2046_Touchscreen, rather than TFT_eSPI's same-bus touch support.

[env:cyd]
build_flags =
	${env.build_flags}
	-DILI9341_DRIVER

[env:cyd2usb]
build_flags =
	${env.build_flags}
	-DILI9341_DRIVER
	-DTFT_RGB_ORDER=TFT_RGB
	-DTFT_INVERSION_ON

; 320 x 480 ST7796S SPI panel, used in 480 x 320 landscape.
; LCDWIKI ESP32-32E: GPIO27 backlight, XPT2046 shares the display SPI bus.
; https://www.lcdwiki.com/3.5inch_ESP32-32E_Display#ESP32_Pin_Assignment
[env:st7796s]
build_unflags =
	-DSPI_FREQUENCY=55000000
	-DTFT_BL=21
build_flags =
	${env.build_flags}
	-DST7796_DRIVER
	-DTFT_BL=27
	-DGAME_TOUCH_SHARED_SPI=1
	-DSPI_FREQUENCY=40000000
