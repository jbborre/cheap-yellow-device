; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = .
default_envs = st7796s

[env]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
	bodmer/TFT_eSPI@^2.5.43
	bodmer/TFT_eWidget@^0.0.6
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
	xreef/PCF8574 library@^2.4.0
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 115200
board_build.partitions = min_spiffs.csv
build_flags = 
	; -Iinclude
	-DUSER_SETUP_LOADED=1
	-DUSE_HSPI_PORT
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BACKLIGHT_ON=HIGH
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DLOAD_GLCD
	-DLOAD_FONT2
	-DLOAD_FONT4
	-DLOAD_FONT6
	-DLOAD_FONT7
	-DLOAD_FONT8
	-DLOAD_GFXFF
	; Driver, backlight, color order, SPI speed and touch bus are target-specific.

; 4-inch LCDWIKI ESP32-32E / ST7796S, 480 x 320 landscape.
; Display and XPT2046 touch share SPI; backlight is GPIO27.
[env:st7796s]
build_flags =
	${env.build_flags}
	-DST7796_DRIVER
	-DTFT_BL=27
	-DTFT_RGB_ORDER=TFT_BGR
	-DTFT_INVERSION_OFF
	-DSPI_FREQUENCY=40000000
	-DGAME_TOUCH_SHARED_SPI=1

; 2.8-inch CYD / ILI9341, 320 x 240 landscape.
; XPT2046 uses separate VSPI pins; backlight is GPIO21.
[env:ili9341]
build_flags =
	${env.build_flags}
	-DILI9341_DRIVER
	-DTFT_BL=21
	-DTFT_RGB_ORDER=TFT_BGR
	-DTFT_INVERSION_OFF
	-DSPI_FREQUENCY=55000000
	-DGAME_TOUCH_SHARED_SPI=0

; Backward-compatible name for the original 2.8-inch board.
[env:cyd]
extends = env:ili9341

; Alternate 2.8-inch dual-USB CYD color/inversion settings.
[env:cyd2usb]
build_flags =
	${env.build_flags}
	-DILI9341_DRIVER
	-DTFT_BL=21
	-DTFT_RGB_ORDER=TFT_RGB
	-DTFT_INVERSION_ON
	-DSPI_FREQUENCY=55000000
	-DGAME_TOUCH_SHARED_SPI=0
